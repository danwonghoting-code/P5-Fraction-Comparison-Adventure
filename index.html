<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>分數比較大冒險 - 糖果 3D 旗艦版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --candy-pink: #ff85a2;
      --candy-purple: #a855f7;
      --candy-purple-dark: #7e22ce;
      --candy-blue: #38bdf8;
      --candy-blue-dark: #0284c7;
      --candy-green: #34d399;
      --candy-green-dark: #059669;
      --candy-yellow: #facc15;
      --candy-yellow-dark: #ca8a04;
      --bg-gradient: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
    }

    * { box-sizing: border-box; touch-action: manipulation; user-select: none; }
    
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow-x: hidden;
    }

    .bg-bubble {
      position: absolute; border-radius: 50%; opacity: 0.4; filter: blur(30px); z-index: -1;
      animation: float 8s infinite ease-in-out alternate;
    }
    .bg-b1 { width: 300px; height: 300px; background: #f472b6; top: -50px; left: -50px; }
    .bg-b2 { width: 350px; height: 350px; background: #38bdf8; bottom: -80px; right: -50px; animation-delay: -4s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(30px) rotate(15deg); }
    }

    #game-container {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 36px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.12), inset 0 2px 4px rgba(255,255,255,0.8);
      width: 100%; max-width: 960px;
      padding: 32px;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }

    .screen { display: none; width: 100%; }
    .screen.active { display: block; }
    
    #menu-screen, #level-summary-screen, #result-screen { text-align: center; }
    
    h1 {
      font-size: 46px; font-weight: 900; margin-bottom: 8px;
      background: linear-gradient(45deg, #ec4899, #8b5cf6, #3b82f6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(2px 4px 0px rgba(255,255,255,0.8));
    }
    .subtitle { font-size: 20px; color: #64748b; font-weight: 700; margin-bottom: 36px; }

    .mode-cards { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
    .mode-btn {
      background: #ffffff; border: 3px solid #f1f5f9; border-radius: 28px;
      padding: 28px 24px; width: 280px; cursor: pointer;
      box-shadow: 0 14px 0 #e2e8f0, 0 18px 30px rgba(0,0,0,0.08);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      position: relative; top: 0;
    }
    .mode-btn:hover { top: -6px; box-shadow: 0 20px 0 #e2e8f0, 0 24px 35px rgba(0,0,0,0.12); }
    .mode-btn:active { top: 8px; box-shadow: 0 6px 0 #e2e8f0, 0 10px 15px rgba(0,0,0,0.08); }
    .mode-icon { font-size: 56px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
    .mode-title { font-size: 24px; font-weight: 900; color: #1e293b; }

    .header-bar {
      display: flex; justify-content: space-between; width: 100%;
      margin-bottom: 24px; font-weight: 700; color: #334155;
      flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .badge {
      background: #ffffff; padding: 10px 18px; border-radius: 20px;
      border: 2px solid #f1f5f9; box-shadow: 0 6px 0 #e2e8f0; font-size: 16px;
      display: flex; align-items: center; gap: 6px;
    }
    .level-indicator { color: #d97706; border-color: #fef3c7; background: #fffbeb; }
    .penalty-badge { color: #e11d48; border-color: #ffe4e6; background: #fff1f2; display: none; }
    .btn-home {
      background: #ffffff; border: 2px solid #e2e8f0; padding: 10px 18px; border-radius: 20px;
      font-weight: 900; color: #64748b; cursor: pointer; box-shadow: 0 6px 0 #cbd5e1;
      transition: all 0.15s;
    }
    .btn-home:active { transform: translateY(4px); box-shadow: 0 2px 0 #cbd5e1; }

    /* 分數排版調整 */
    .equation-container {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin: 16px 0 24px 0; min-height: 140px; width: 100%; flex-wrap: wrap;
    }
    .fraction-wrapper {
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      padding: 12px 20px; border-radius: 24px; border: 3px solid #e2e8f0;
      box-shadow: 0 10px 0 #cbd5e1, 0 12px 20px rgba(0,0,0,0.06);
      pointer-events: none;
    }
    .fraction-mixed {
      display: inline-flex; align-items: center; /* 確保帶分數整數與分數線垂直置中 */
      justify-content: center; gap: 6px;
    }
    .number-whole { font-size: 42px; font-weight: 900; color: #0f172a; line-height: 1; margin-top: -4px; }
    .integer-only { font-size: 42px; font-weight: 900; color: #0f172a; padding: 4px 12px; }
    .fraction { display: inline-flex; flex-direction: column; align-items: center; font-size: 30px; font-weight: 900; color: #0f172a; }
    .numerator { border-bottom: 4px solid #0f172a; padding-bottom: 2px; text-align: center; width: 100%; border-radius: 2px; }
    .denominator { padding-top: 2px; text-align: center; width: 100%; }
    .symbol-text { font-size: 46px; font-weight: 900; color: var(--candy-purple); margin: 0 6px; }

    .drop-slot {
      border: 3px dashed #cbd5e1; border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; background: rgba(255, 255, 255, 0.6);
      transition: all 0.2s; cursor: pointer; min-width: 80px; min-height: 80px;
    }
    .drop-slot.slot-symbol { width: 80px; height: 80px; font-size: 40px; color: var(--candy-purple); }
    .drop-slot.slot-fraction { min-width: 120px; min-height: 100px; padding: 8px; }
    .drop-slot.active { border-color: var(--candy-purple); background: #f3e8ff; box-shadow: 0 0 0 5px rgba(168, 85, 247, 0.3); transform: scale(1.04); }
    .drop-slot.filled { border-style: solid; border-color: var(--candy-blue); background: #e0f2fe; box-shadow: 0 8px 0 #93c5fd; }
    .drop-slot.slot-highlight { border-color: var(--candy-green) !important; background: #d1fae5 !important; transform: scale(1.08); }

    .controls-area { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; margin-top: 10px; }
    .cards-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 8px; }
    .symbol-card {
      width: 84px; height: 84px; background: linear-gradient(180deg, #c084fc 0%, var(--candy-purple) 100%);
      color: white; border-radius: 24px; font-size: 44px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 0 var(--candy-purple-dark), 0 12px 20px rgba(168,85,247,0.3);
      cursor: grab; touch-action: none; transition: transform 0.15s;
    }
    .fraction-card {
      background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%); border: 3px solid #7dd3fc; border-radius: 24px;
      padding: 10px 16px; box-shadow: 0 10px 0 var(--candy-blue-dark), 0 12px 20px rgba(56,189,248,0.25);
      cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center;
    }
    .symbol-card:active, .fraction-card:active { cursor: grabbing; transform: scale(0.96); }
    .fraction-card.used { opacity: 0.3; pointer-events: none; filter: grayscale(0.9); box-shadow: 0 4px 0 #94a3b8; }
    .dragging-ghost { position: fixed !important; z-index: 9999 !important; pointer-events: none !important; opacity: 0.9; transform: scale(1.1) rotate(-3deg); }

    .btn {
      background: linear-gradient(180deg, #6ee7b7 0%, var(--candy-green) 100%);
      color: white; border: none; padding: 16px 50px; font-size: 24px; font-weight: 900; border-radius: 28px;
      box-shadow: 0 10px 0 var(--candy-green-dark), 0 15px 25px rgba(16,185,129,0.3);
      cursor: pointer; transition: all 0.15s; letter-spacing: 1px; position: relative; top: 0;
    }
    .btn:hover { top: -3px; box-shadow: 0 13px 0 var(--candy-green-dark), 0 18px 28px rgba(16,185,129,0.35); }
    .btn:active { top: 6px; box-shadow: 0 4px 0 var(--candy-green-dark), 0 8px 15px rgba(16,185,129,0.2); }
    
    .btn-blue {
      background: linear-gradient(180deg, #7dd3fc 0%, var(--candy-blue) 100%);
      box-shadow: 0 10px 0 var(--candy-blue-dark), 0 15px 25px rgba(2,132,199,0.3);
    }
    .btn-blue:hover { top: -3px; box-shadow: 0 13px 0 var(--candy-blue-dark), 0 18px 28px rgba(2,132,199,0.35); }
    .btn-blue:active { top: 6px; box-shadow: 0 4px 0 var(--candy-blue-dark), 0 8px 15px rgba(2,132,199,0.2); }

    .feedback { font-size: 24px; font-weight: 900; min-height: 36px; text-align: center; }
    .correct { color: #15803d; }
    .wrong { color: #b91c1c; }

    .hint-box {
      display: none; background: linear-gradient(180deg, #fffde7 0%, #fef9c3 100%);
      border: 3px solid var(--candy-yellow); border-radius: 24px; padding: 16px 24px; margin-top: 8px; width: 100%;
      color: #854d0e; font-size: 17px; font-weight: 700; text-align: left; line-height: 1.6;
      box-shadow: 0 8px 0 var(--candy-yellow-dark);
    }

    .final-score { font-size: 64px; font-weight: 900; color: var(--candy-blue-dark); margin: 16px 0; }
    
    .history-container {
      margin-top: 24px; width: 100%; max-height: 400px; overflow-y: auto;
      background: #f8fafc; border-radius: 20px; border: 3px solid #e2e8f0; padding: 16px;
      display: flex; flex-direction: column; gap: 12px; text-align: left;
    }
    .history-item {
      background: #ffffff; padding: 16px; border-radius: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 8px solid #cbd5e1;
    }
    .history-item.pass { border-left-color: #34d399; }
    .history-item.fail { border-left-color: #fb7185; }
    .history-title { font-size: 16px; font-weight: 900; color: #475569; margin-bottom: 8px; }
    .history-ans { font-size: 18px; font-weight: 700; color: #1e293b; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .history-ans.wrong-ans { color: #e11d48; margin-top: 8px; font-size: 16px; background: #fff1f2; padding: 8px; border-radius: 12px; }

    .mini-frac { display: inline-flex; align-items: center; font-size: 18px; background:#f1f5f9; padding:4px 8px; border-radius:8px; border:1px solid #cbd5e1; }
    .mini-frac .w { font-weight: 900; margin-right: 4px; }
    .mini-frac .f { display: inline-flex; flex-direction: column; font-size: 14px; line-height: 1.1; font-weight: 900; align-items: center; }
    .mini-frac .n { border-bottom: 2px solid #0f172a; width: 100%; text-align: center; }

    .shake { animation: shake 0.5s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .bounce { animation: bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes bounce { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

<div class="bg-bubble bg-b1"></div>
<div class="bg-bubble bg-b2"></div>

<div id="game-container">
  <div id="menu-screen" class="screen active">
    <h1>🍬 分數比較大冒險</h1>
    <div class="subtitle">全三關階梯挑戰，每錯一題將增加挑戰數量！<br>（符合 P5 數學課程標準：無同分母題）</div>
    <div class="mode-cards">
      <div class="mode-btn" onclick="startGame('symbol')">
        <div class="mode-icon">✍️</div>
        <div class="mode-title">填寫符號模式</div>
      </div>
      <div class="mode-btn" onclick="startGame('arrange')">
        <div class="mode-icon">🧩</div>
        <div class="mode-title">分數排序模式</div>
      </div>
    </div>
  </div>

  <div id="quiz-screen" class="screen">
    <div class="header-bar">
      <button class="btn-home" onclick="showScreen('menu-screen')">🏠 主選單</button>
      <div class="badge level-indicator" id="level-text">關卡 1</div>
      <div class="badge">進度：<span id="q-progress">0/7</span></div>
      <div class="badge penalty-badge" id="penalty-badge">⚠️ 錯題加練 +<span id="penalty-num">0</span></div>
      <div class="badge">得分：<span id="score-num">0</span></div>
    </div>

    <div class="equation-container" id="equation"></div>
    <div class="feedback" id="feedback"></div>
    <div class="hint-box" id="hint-box"></div>

    <div class="controls-area">
      <p style="color: #64748b; font-size: 16px; font-weight: 700; margin: 0;" id="instruction-text"></p>
      <div class="cards-container" id="cards-container"></div>
      <button class="btn" id="submit-btn" onclick="checkAnswer()">確認答案</button>
    </div>
  </div>

  <div id="level-summary-screen" class="screen">
    <h1>🎉 關卡完成！</h1>
    <div class="final-score" id="level-score-display">0 分</div>
    <p id="level-desc" class="subtitle"></p>
    <button class="btn btn-blue" id="next-level-btn" onclick="startNextLevel()">進入下一關</button>
  </div>

  <div id="result-screen" class="screen">
    <h1>🏆 冒險大通關！</h1>
    <div class="final-score" id="final-score">0 分</div>
    <p class="subtitle">來看看你的學習歷程與錯題紀錄吧：</p>
    <div class="history-container" id="history-list"></div>
    <button class="btn" onclick="showScreen('menu-screen')" style="margin-top: 24px;">回到主選單</button>
  </div>
</div>

<script>
  let gameMode = 'symbol';
  
  let reqLevels = { 1: 7, 2: 5, 3: 5 };
  let progressLevels = { 1: 0, 2: 0, 3: 0 };
  let currentLevel = 1;
  let score = 0;
  
  let currentQuestionData = {};
  let currentQuestionFailed = false;
  let lastWrongAns = null;
  
  let historyLog = [];
  let usedIndicesByLevel = { 1: [], 2: [], 3: [] };

  let selectedSlotIndex = 0;
  let ghostEl = null;

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function lcm(a, b) { return (a * b) / gcd(a, b); }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function startGame(mode) {
    gameMode = mode;
    reqLevels = { 1: 7, 2: 5, 3: 5 };
    progressLevels = { 1: 0, 2: 0, 3: 0 };
    currentLevel = 1;
    score = 0;
    historyLog = [];
    usedIndicesByLevel = { 1: [], 2: [], 3: [] };
    
    showScreen('quiz-screen');
    renderQuestion();
  }

  function startNextLevel() {
    currentLevel++;
    if (currentLevel > 3) {
      renderFinalResults();
      showScreen('result-screen');
    } else {
      showScreen('quiz-screen');
      renderQuestion();
    }
  }

  function compareFractions(f1, f2) {
    const v1 = f1.type === 'integer' ? f1.whole : (f1.whole || 0) + f1.num / f1.den;
    const v2 = f2.type === 'integer' ? f2.whole : (f2.whole || 0) + f2.num / f2.den;
    if (Math.abs(v1 - v2) < 0.00001) return '=';
    return v1 > v2 ? '>' : '<';
  }
  
  function getFractionValue(f) {
    return f.type === 'integer' ? f.whole : (f.whole || 0) + f.num / f.den;
  }

  /* 徹底移除所有同分母題目的題庫 */
  const QUESTION_POOLS = {
    1: [ 
      [ { whole: 0, num: 1, den: 6 }, { whole: 0, num: 3, den: 4 } ],
      [ { whole: 0, num: 1, den: 4 }, { whole: 0, num: 2, den: 3 } ],
      [ { whole: 0, num: 2, den: 7 }, { whole: 0, num: 5, den: 8 } ],
      [ { whole: 0, num: 4, den: 9 }, { whole: 0, num: 2, den: 5 } ],
      [ { whole: 0, num: 1, den: 3 }, { whole: 0, num: 5, den: 6 } ],
      [ { whole: 0, num: 2, den: 9 }, { whole: 0, num: 4, den: 5 } ],
      [ { whole: 0, num: 3, den: 8 }, { whole: 0, num: 7, den: 10 } ],
      [ { whole: 0, num: 1, den: 4 }, { whole: 0, num: 2, den: 5 } ],
      [ { whole: 0, num: 3, den: 10 }, { whole: 0, num: 2, den: 3 } ],
      [ { whole: 0, num: 2, den: 11 }, { whole: 0, num: 6, den: 7 } ]
    ],
    2: [ 
      [ { whole: 0, num: 6, den: 7 }, { whole: 0, num: 11, den: 14 } ],
      [ { whole: 0, num: 4, den: 9 }, { whole: 0, num: 5, den: 6 } ],
      [ { whole: 1, num: 9, den: 10 }, { whole: 0, num: 39, den: 20, type: 'improper' } ],
      [ { whole: 5, num: 3, den: 8 }, { whole: 0, num: 21, den: 4, type: 'improper' } ],
      [ { whole: 0, num: 3, den: 5 }, { whole: 0, num: 5, den: 8 } ],
      [ { whole: 1, num: 2, den: 3 }, { whole: 0, num: 7, den: 4, type: 'improper' } ],
      [ { whole: 3, num: 1, den: 2 }, { whole: 0, num: 12, den: 5, type: 'improper' } ],
      [ { whole: 0, num: 5, den: 6 }, { whole: 0, num: 7, den: 9 } ],
      [ { whole: 2, num: 1, den: 3 }, { whole: 0, num: 9, den: 4, type: 'improper' } ],
      [ { whole: 1, num: 3, den: 4 }, { whole: 0, num: 13, den: 8, type: 'improper' } ]
    ],
    3: [ 
      [ { whole: 0, num: 2, den: 3 }, { whole: 0, num: 5, den: 7 }, { whole: 0, num: 3, den: 5 } ],
      [ { whole: 2, num: 1, den: 1, type: 'integer' }, { whole: 0, num: 25, den: 12, type: 'improper' }, { whole: 0, num: 2, den: 3 } ],
      [ { whole: 1, num: 3, den: 8 }, { whole: 0, num: 19, den: 12, type: 'improper' }, { whole: 0, num: 13, den: 6, type: 'improper' } ],
      [ { whole: 0, num: 5, den: 12 }, { whole: 0, num: 5, den: 6 }, { whole: 0, num: 7, den: 10 } ],
      [ { whole: 4, num: 5, den: 8 }, { whole: 0, num: 3, den: 4 }, { whole: 0, num: 21, den: 5, type: 'improper' } ],
      [ { whole: 1, num: 5, den: 8 }, { whole: 1, num: 7, den: 9 }, { whole: 1, num: 5, den: 6 } ],
      [ { whole: 3, num: 1, den: 1, type: 'integer' }, { whole: 2, num: 7, den: 8 }, { whole: 0, num: 11, den: 4, type: 'improper' } ],
      [ { whole: 0, num: 1, den: 2 }, { whole: 0, num: 2, den: 5 }, { whole: 0, num: 3, den: 4 } ],
      [ { whole: 1, num: 1, den: 4 }, { whole: 0, num: 4, den: 3, type: 'improper' }, { whole: 1, num: 1, den: 6 } ],
      [ { whole: 0, num: 7, den: 8 }, { whole: 4, num: 1, den: 4 }, { whole: 0, num: 25, den: 6, type: 'improper' } ]
    ]
  };

  function generateQuestion() {
    let pool = QUESTION_POOLS[currentLevel];
    let usedIndices = usedIndicesByLevel[currentLevel];
    let availableIndices = [];
    for (let i = 0; i < pool.length; i++) {
      if (!usedIndices.includes(i)) availableIndices.push(i);
    }
    if (availableIndices.length === 0) {
      usedIndicesByLevel[currentLevel] = [];
      for (let i = 0; i < pool.length; i++) availableIndices.push(i);
      availableIndices = usedIndicesByLevel[currentLevel];
    }

    let chosenIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
    usedIndicesByLevel[currentLevel].push(chosenIndex);
    let selectedFractions = JSON.parse(JSON.stringify(pool[chosenIndex]));

    if (currentLevel === 3) {
      let ascending = Math.random() > 0.5;
      selectedFractions.sort((a, b) => {
        let diff = getFractionValue(a) - getFractionValue(b);
        return ascending ? diff : -diff;
      });
    }

    let data = { fractions: selectedFractions, symbols: [] };
    for (let i = 0; i < data.fractions.length - 1; i++) {
      data.symbols.push(compareFractions(data.fractions[i], data.fractions[i+1]));
    }

    if (gameMode === 'arrange') {
      data.correctFractions = [...data.fractions];
      data.optionsFractions = [...data.fractions].sort(() => Math.random() - 0.5);
    }

    return data;
  }

  function renderFractionHtml(f) {
    if (f.type === 'integer' || (f.num === 0 && f.whole)) {
      return `<div class="fraction-wrapper"><span class="integer-only">${f.whole}</span></div>`;
    }
    if (f.whole && f.whole > 0) {
      return `
        <div class="fraction-wrapper">
          <div class="fraction-mixed">
            <span class="number-whole">${f.whole}</span>
            <div class="fraction">
              <div class="numerator">${f.num}</div>
              <div class="denominator">${f.den}</div>
            </div>
          </div>
        </div>
      `;
    } else {
      return `
        <div class="fraction-wrapper">
          <div class="fraction">
            <div class="numerator">${f.num}</div>
            <div class="denominator">${f.den}</div>
          </div>
        </div>
      `;
    }
  }

  function updateHeader() {
    let texts = ["難度 1：1/2 基準比對", "難度 2：異分母比較", "🔥 難度 3：三數綜合排序"];
    document.getElementById('level-text').innerText = texts[currentLevel - 1];
    document.getElementById('q-progress').innerText = `${progressLevels[currentLevel]}/${reqLevels[currentLevel]}`;
    document.getElementById('score-num').innerText = score;
    
    let baseReq = currentLevel === 1 ? 7 : 5;
    let penalty = reqLevels[currentLevel] - baseReq;
    let pb = document.getElementById('penalty-badge');
    if (penalty > 0) {
      pb.style.display = 'flex';
      document.getElementById('penalty-num').innerText = penalty;
    } else {
      pb.style.display = 'none';
    }
  }

  function renderQuestion() {
    currentQuestionData = generateQuestion();
    currentQuestionFailed = false;
    lastWrongAns = null;
    
    updateHeader();
    
    document.getElementById('feedback').innerText = '';
    const hintBox = document.getElementById('hint-box');
    hintBox.style.display = 'none';
    hintBox.innerHTML = '';

    const eqContainer = document.getElementById('equation');
    const cardsContainer = document.getElementById('cards-container');
    const instructionText = document.getElementById('instruction-text');
    eqContainer.innerHTML = '';
    cardsContainer.innerHTML = '';

    if (gameMode === 'symbol') {
      instructionText.innerText = "拖動符號至目標框，或點擊目標框再選擇符號：";
      currentQuestionData.fractions.forEach((f, idx) => {
        eqContainer.insertAdjacentHTML('beforeend', renderFractionHtml(f));
        if (idx < currentQuestionData.fractions.length - 1) {
          let slotHtml = `<div class="drop-slot slot-symbol ${idx === 0 ? 'active' : ''}" data-slot="${idx}">?</div>`;
          eqContainer.insertAdjacentHTML('beforeend', slotHtml);
        }
      });
      cardsContainer.innerHTML = `
        <div class="symbol-card" data-sym=">">&gt;</div>
        <div class="symbol-card" data-sym="<">&lt;</div>
      `;
    } else {
      instructionText.innerText = "拖動分數卡片至目標框（點擊已填卡片可清除）：";
      currentQuestionData.fractions.forEach((_, idx) => {
        let slotHtml = `<div class="drop-slot slot-fraction ${idx === 0 ? 'active' : ''}" data-slot="${idx}">拖入 / 點擊</div>`;
        eqContainer.insertAdjacentHTML('beforeend', slotHtml);
        if (idx < currentQuestionData.symbols.length) {
          let symHtml = `<div class="symbol-text">${currentQuestionData.symbols[idx]}</div>`;
          eqContainer.insertAdjacentHTML('beforeend', symHtml);
        }
      });
      currentQuestionData.optionsFractions.forEach((f, idx) => {
        let cardHtml = `
          <div class="fraction-card" data-fidx="${idx}">
            ${renderFractionHtml(f)}
          </div>
        `;
        cardsContainer.insertAdjacentHTML('beforeend', cardHtml);
      });
    }

    selectedSlotIndex = 0;
    bindEvents();
  }

  function bindEvents() {
    const slots = document.querySelectorAll('.drop-slot');
    slots.forEach(slot => {
      slot.addEventListener('click', () => {
        if (gameMode === 'arrange' && slot.classList.contains('filled')) clearSlot(slot);
        slots.forEach(s => s.classList.remove('active'));
        slot.classList.add('active');
        selectedSlotIndex = parseInt(slot.dataset.slot);
      });
    });

    const cards = document.querySelectorAll('.symbol-card, .fraction-card');
    cards.forEach(card => card.addEventListener('pointerdown', handlePointerDown));
  }

  function handlePointerDown(e) {
    if (e.button && e.button !== 0) return;
    const card = e.currentTarget;
    if (card.classList.contains('used')) return;
    const startX = e.clientX, startY = e.clientY;
    let isDragging = false;

    const onPointerMove = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!isDragging && (dx * dx + dy * dy) > 36) {
        isDragging = true;
        ghostEl = card.cloneNode(true);
        ghostEl.classList.add('dragging-ghost');
        const rect = card.getBoundingClientRect();
        ghostEl.style.width = rect.width + 'px';
        ghostEl.style.height = rect.height + 'px';
        document.body.appendChild(ghostEl);
      }
      if (isDragging && ghostEl) {
        ghostEl.style.left = (ev.clientX - ghostEl.offsetWidth / 2) + 'px';
        ghostEl.style.top = (ev.clientY - ghostEl.offsetHeight / 2) + 'px';
        document.querySelectorAll('.slot-highlight').forEach(s => s.classList.remove('slot-highlight'));
        const dropTarget = document.elementFromPoint(ev.clientX, ev.clientY);
        const targetSlot = dropTarget?.closest('.drop-slot');
        if (targetSlot) targetSlot.classList.add('slot-highlight');
      }
    };

    const onPointerUp = (ev) => {
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
      if (ghostEl) { ghostEl.remove(); ghostEl = null; }
      if (isDragging) {
        document.querySelectorAll('.slot-highlight').forEach(s => s.classList.remove('slot-highlight'));
        const dropTarget = document.elementFromPoint(ev.clientX, ev.clientY);
        const targetSlot = dropTarget?.closest('.drop-slot');
        if (targetSlot) {
          selectedSlotIndex = parseInt(targetSlot.dataset.slot);
          document.querySelectorAll('.drop-slot').forEach(s => s.classList.remove('active'));
          targetSlot.classList.add('active');
          if (gameMode === 'symbol') fillSymbolSlot(card.dataset.sym);
          else fillFractionSlot(card);
        }
      } else {
        if (gameMode === 'symbol') fillSymbolSlot(card.dataset.sym);
        else fillFractionSlot(card);
      }
    };

    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
  }

  function fillSymbolSlot(sym) {
    const slots = document.querySelectorAll('.drop-slot');
    let activeSlot = document.querySelector(`.drop-slot[data-slot="${selectedSlotIndex}"]`);
    if (activeSlot) {
      activeSlot.innerText = sym;
      activeSlot.classList.add('filled');
      if (selectedSlotIndex < slots.length - 1) {
        selectedSlotIndex++;
        slots.forEach(s => s.classList.remove('active'));
        slots[selectedSlotIndex].classList.add('active');
      }
    }
  }

  function fillFractionSlot(cardEl) {
    const slots = document.querySelectorAll('.drop-slot');
    let activeSlot = document.querySelector(`.drop-slot[data-slot="${selectedSlotIndex}"]`);
    if (activeSlot) {
      if (activeSlot.dataset.selectedFidx !== undefined) clearSlot(activeSlot);
      const fIdx = cardEl.dataset.fidx;
      activeSlot.innerHTML = renderFractionHtml(currentQuestionData.optionsFractions[fIdx]);
      activeSlot.dataset.selectedFidx = fIdx;
      activeSlot.classList.add('filled');
      cardEl.classList.add('used');
      if (selectedSlotIndex < slots.length - 1) {
        selectedSlotIndex++;
        slots.forEach(s => s.classList.remove('active'));
        slots[selectedSlotIndex].classList.add('active');
      }
    }
  }

  function clearSlot(slotEl) {
    const prevFidx = slotEl.dataset.selectedFidx;
    if (prevFidx !== undefined) {
      const prevCard = document.querySelector(`.fraction-card[data-fidx="${prevFidx}"]`);
      if (prevCard) prevCard.classList.remove('used');
      delete slotEl.dataset.selectedFidx;
    }
    slotEl.classList.remove('filled');
    slotEl.innerHTML = '拖入 / 點擊';
  }

  function generateHintHtml(level, fractions) {
    if (level === 1) return `💡 <b>小提示：</b>可利用 <b>1/2</b> 基準快速判斷。`;
    if (level === 2) {
      if (fractions[0].den && fractions[1].den) {
        let l = lcm(fractions[0].den, fractions[1].den);
        return `💡 <b>通分提示：</b>分母最小公倍數(LCM)為 <b>${l}</b>。`;
      }
      return `💡 <b>提示：</b>請先將假分數化為帶分數再比較。`;
    }
    return `💡 <b>綜合提示：</b>先比較整數部分，再尋找分母公倍數進行排序。`;
  }

  function checkAnswer() {
    const slots = document.querySelectorAll('.drop-slot');
    let isCorrect = true, allFilled = true;
    let userAns = [];

    if (gameMode === 'symbol') {
      slots.forEach(slot => {
        if (slot.innerText === '?' || !slot.innerText) allFilled = false;
        userAns.push(slot.innerText);
      });
      if (!allFilled) { showFeedback('請先填寫所有符號！'); triggerShake(); return; }
      isCorrect = userAns.every((val, idx) => val === currentQuestionData.symbols[idx]);
    } else {
      slots.forEach(slot => {
        if (slot.dataset.selectedFidx === undefined) allFilled = false;
        else userAns.push(currentQuestionData.optionsFractions[slot.dataset.selectedFidx]);
      });
      if (!allFilled) { showFeedback('請先將所有卡片放好！'); triggerShake(); return; }
      for (let i = 0; i < currentQuestionData.symbols.length; i++) {
        if (compareFractions(userAns[i], userAns[i+1]) !== currentQuestionData.symbols[i]) {
          isCorrect = false; break;
        }
      }
    }

    const fb = document.getElementById('feedback');
    const hintBox = document.getElementById('hint-box');

    if (isCorrect) {
      progressLevels[currentLevel]++;
      let gainedScore = 20 + (currentQuestionFailed ? 0 : 10);
      score += gainedScore;
      fb.className = 'feedback correct bounce';
      fb.innerText = `🎉 答對了！+${gainedScore} 分`;
      hintBox.style.display = 'none';

      historyLog.push({
        level: currentLevel, mode: gameMode,
        data: currentQuestionData, userAns: userAns,
        isCorrectFirstTry: !currentQuestionFailed,
        wrongAns: lastWrongAns
      });

      document.getElementById('submit-btn').disabled = true;
      updateHeader();

      setTimeout(() => {
        document.getElementById('submit-btn').disabled = false;
        if (progressLevels[currentLevel] >= reqLevels[currentLevel]) {
          showLevelSummary();
        } else {
          renderQuestion();
        }
      }, 1500);

    } else {
      reqLevels[currentLevel]++; 
      currentQuestionFailed = true;
      lastWrongAns = [...userAns];
      
      updateHeader();
      fb.className = 'feedback wrong';
      fb.innerText = `答案不對喔！已加入額外練題，請修正後再試一次：`;
      triggerShake();
      hintBox.innerHTML = generateHintHtml(currentLevel, currentQuestionData.fractions);
      hintBox.style.display = 'block';
    }
  }

  function triggerShake() {
    const container = document.getElementById('equation');
    container.classList.remove('shake');
    void container.offsetWidth;
    container.classList.add('shake');
  }

  function showFeedback(msg) {
    const fb = document.getElementById('feedback');
    fb.className = 'feedback wrong';
    fb.innerText = msg;
  }

  function showLevelSummary() {
    showScreen('level-summary-screen');
    document.getElementById('level-score-display').innerText = score + ' 分';
    let texts = [
      "做得好！成功掌握基礎比較，繼續挑戰異分母！",
      "太棒了！異分母與通分難不倒你，準備迎接最終的三數排序挑戰吧！",
      "完美！你已經突破所有關卡，成為分數比較大師！"
    ];
    document.getElementById('level-desc').innerText = texts[currentLevel - 1];
    let btn = document.getElementById('next-level-btn');
    btn.innerText = currentLevel === 3 ? "查看最終成績與錯題本" : "進入下一關";
  }

  function renderMiniFrac(f) {
    if (f.type === 'integer' || !f.den) return `<span class="mini-frac"><span class="w">${f.whole}</span></span>`;
    let html = `<span class="mini-frac">`;
    if (f.whole) html += `<span class="w">${f.whole}</span>`;
    html += `<span class="f"><span class="n">${f.num}</span><span class="d">${f.den}</span></span></span>`;
    return html;
  }

  function renderFinalResults() {
    document.getElementById('final-score').innerText = score + ' 分';
    const container = document.getElementById('history-list');
    container.innerHTML = '';

    historyLog.forEach((log, idx) => {
      let div = document.createElement('div');
      div.className = 'history-item ' + (log.isCorrectFirstTry ? 'pass' : 'fail');
      
      let title = `<div class="history-title">第 ${idx + 1} 題 (關卡 ${log.level}) - ${log.isCorrectFirstTry ? '✅ 一次答對' : '❌ 曾答錯'}</div>`;
      
      let correctStr = '';
      let wrongStr = '';

      if (log.mode === 'symbol') {
        correctStr = log.data.fractions.map(renderMiniFrac).reduce((acc, f, i) => acc + (i > 0 ? ` <b>${log.data.symbols[i-1]}</b> ` : '') + f, '');
        if (!log.isCorrectFirstTry && log.wrongAns) {
          wrongStr = log.data.fractions.map(renderMiniFrac).reduce((acc, f, i) => acc + (i > 0 ? ` <b>${log.wrongAns[i-1]}</b> ` : '') + f, '');
        }
      } else {
        correctStr = log.data.fractions.map(renderMiniFrac).join(` <b>${log.data.symbols[0]}</b> `);
        if (!log.isCorrectFirstTry && log.wrongAns) {
          wrongStr = log.wrongAns.map(renderMiniFrac).join(` <b>${log.data.symbols[0]}</b> `);
        }
      }

      let content = `<div class="history-ans">正確答案：${correctStr}</div>`;
      if (wrongStr) {
        content += `<div class="history-ans wrong-ans">你的錯誤嘗試：${wrongStr}</div>`;
      }

      div.innerHTML = title + content;
      container.appendChild(div);
    });
  }
</script>
